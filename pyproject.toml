[project]
name = "so101-smolvla-edge"
version = "0.1.0"
description = "SmolVLA inference on Jetson Orin, desktop GPUs and Intel NPUs, and fail-safe bimanual SO-101 control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "safetensors>=0.4",
    "pyserial>=3.5",
    "pyyaml>=6.0",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
# one torch flavour per machine
jp7 = ["torch>=2.14"]  # JetPack 7 (CUDA 13, Python 3.12), torch from pytorch.org cu132
jp6 = ["torch==2.11.0; python_version == '3.10'", "nvidia-cudss-cu12"]  # JetPack 6, jetson-ai-lab
desktop = ["torch>=2.9"]  # x86 with an NVIDIA driver >= 580, torch from pytorch.org cu130
npu = ["torch>=2.6", "openvino>=2026.2"]  # Intel Core Ultra; torch only builds the graphs
openvino = ["openvino>=2026.2"]  # OpenVINO's CPU plugin next to CUDA torch, to cross-check graphs
export = ["transformers>=4.50,<5"]  # the tokenizer, for `export`
trt = ["onnx>=1.17"]  # the ONNX export for `build-trt`; TensorRT comes from JetPack or pip
dev = ["pytest>=8", "ruff>=0.17"]
viz = ["rerun-sdk>=0.38,<0.39"]  # `run --rerun`; the viewing machine needs the same version

[project.scripts]
so101-smolvla-edge = "so101_smolvla_edge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so101_smolvla_edge"]

[tool.uv]
# fail the lock on any machine if a Jetson dependency has no aarch64 wheel
required-environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]
conflicts = [[{ extra = "jp7" }, { extra = "jp6" }, { extra = "desktop" }, { extra = "npu" }]]
# nvidia-cudss-cu12 pulls server-ARM cuBLAS and NVRTC wheels, which shadow JetPack's libraries on a
# Jetson and make cuBLAS fail with CUBLAS_STATUS_ALLOC_FAILED, so they are never installed
override-dependencies = [
    "nvidia-cublas-cu12; sys_platform == 'never'",
    "nvidia-cuda-nvrtc-cu12; sys_platform == 'never'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", extra = "jp7" },
    { index = "jetson-jp6", extra = "jp6" },
    { index = "pytorch-cu130", extra = "desktop" },
    { index = "pytorch-cpu", extra = "npu" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "jetson-jp6"
url = "https://pypi.jetson-ai-lab.io/jp6/cu126/+simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

# pixi runs the x86 machines (desktop GPU, Intel NPU laptop). The Jetson keeps uv
# (scripts/setup_jetson.sh): its torch comes from JetPack indexes and TensorRT from the system.
# pixi ignores [tool.uv.sources], so each torch flavour names its index again here.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.50"

[tool.pixi.dependencies]
python = "3.12.*"

[tool.pixi.pypi-dependencies]
so101-smolvla-edge = { path = ".", editable = true }

[tool.pixi.feature.desktop.pypi-dependencies]
# cu130 has the torch and Triton the Orin's jp7 runs, so both compile the kernels with one Triton
torch = { version = ">=2.9", index = "https://download.pytorch.org/whl/cu130" }

[tool.pixi.feature.trt.pypi-dependencies]
# < 11: TensorRT 11 builds strongly typed networks only, and trt_vision builds a weakly typed one
# from the float32 ONNX graph, as TensorRT 10 on the Orin does
tensorrt-cu13 = ">=10.13,<11"

[tool.pixi.feature.npu.pypi-dependencies]
torch = { version = ">=2.9", index = "https://download.pytorch.org/whl/cpu" }

[tool.pixi.feature.profile.dependencies]
# Ubuntu's nsight-systems 2023.4 silently drops cuBLAS kernels under a 595 driver
nsight-systems = ">=2026.1"

[tool.pixi.feature.profile.tasks]
nsys-profile = { cmd = "python scripts/nsys_profile.py", description = "Nsight Systems trace and per-stage report in profiles/<label>/" }

[tool.pixi.environments]
# default: CUDA torch, and OpenVINO's CPU plugin to check the OpenVINO graphs on the same machine
default = { features = ["desktop", "trt", "openvino", "dev"], solve-group = "desktop" }
profile = { features = ["desktop", "trt", "openvino", "dev", "profile"], solve-group = "desktop" }
npu = { features = ["npu", "dev"] }
export = { features = ["desktop", "export", "dev"], solve-group = "desktop" }

[tool.pixi.tasks]
test = { cmd = "pytest", description = "unit, simulated-hardware and backend tests" }
lint = { cmd = "ruff check . && ruff format --check .", description = "what CI checks" }
doctor = { cmd = "so101-smolvla-edge doctor", description = "check torch, CUDA, Triton, OpenVINO, ports" }
verify = { cmd = "so101-smolvla-edge verify", description = "the engine against the bundle's reference actions" }
bench = { cmd = "so101-smolvla-edge bench", description = "latency per chunk" }
build-ov = { cmd = "so101-smolvla-edge build-ov", description = "OpenVINO graphs for a bundle" }
sim = { cmd = "so101-smolvla-edge run configs/sim.yaml --sim --commands enable,go,wait5 --bundle", description = "the robot process on simulated servos: pixi run sim BUNDLE" }
