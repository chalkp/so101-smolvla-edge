name: CI

on:
  pull_request:
  push:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uvx ruff@0.17.1 check .
      - run: uvx ruff@0.17.1 format --check .

  test:
    # Hosted runners have no GPU: the CUDA tests skip, the rest run on the CPU.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --locked --extra desktop --extra dev
      - run: uv run pytest
      - run: uv build
